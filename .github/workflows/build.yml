name: build

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - run: npx electron-builder --win nsis portable --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: SiameseBreak-windows
          path: dist/SiameseBreak-*.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 暹罗猫休息提醒 v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: dist/SiameseBreak-*.exe
          body: |
            下载 `SiameseBreak-Setup-${{ steps.version.outputs.version }}.exe` 双击安装即可；不想安装可以下载 Portable 版直接运行。
            如果 Windows 提示“已保护你的电脑”，点「更多信息」→「仍要运行」。
