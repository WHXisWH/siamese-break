name: build

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - "electron-builder.config.js"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        cat: [siamese, munchkin]
    env:
      CAT_VARIANT: ${{ matrix.cat }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        shell: bash
        run: |
          read -r version tag name < <(node -e "const c=require('./src/cats.json')[process.env.CAT_VARIANT];console.log(c.version, c.tagPrefix + c.version, c.displayName)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$tag already released, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.meta.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.meta.outputs.exists == 'false'
        run: npm ci

      - if: steps.meta.outputs.exists == 'false'
        run: npm run dist

      - if: steps.meta.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cat }}-windows
          path: dist/${{ matrix.cat }}/*.exe

      - if: steps.meta.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }} v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: ${{ matrix.cat == 'siamese' }}
          files: dist/${{ matrix.cat }}/*.exe
          body: |
            下载文件名里带 `Setup` 的 exe，双击安装即可；不想安装可以下载 Portable 版直接运行。
            如果 Windows 提示“已保护你的电脑”，点「更多信息」→「仍要运行」。
